# APP Config og Server
spring.application.name=AiProject
server.port=8080

# Database (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/aiproject?useSSL=false&serverTimezone=Europe/Copenhagen]
spring.datasource.username=aiproject
spring.datasource.password=1234

# spring.datasource.url=${URL}
#spring.datasource.username=${USERNAME}
# spring.datasource.password=${PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Groq API nøgle
groq.api.key=${GROQ_API_KEY}
# Vi kan eventuel lave samme setup som Ronnis chatgptjokes med model, temp, token bla bla etc.

# Logging - Viser SQL og HTTP-requests i terminalen
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.example.aiproject=DEBUG

