<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportResponse 🏃</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <!-- Header -->
    <h1>🏃 SportResponse</h1>
    <p class="subtitle">Din personlige løbetræner powered by AI</p>

    <!-- Analyse Form -->
    <form id="analyzeForm">
        <div class="input-group">
            <label for="distance">Distance (km)</label>
            <input
                    type="number"
                    id="distance"
                    step="0.1"
                    min="0.1"
                    placeholder="fx 5.0"
                    required
            >
        </div>

        <div class="input-group">
            <label for="time">Tid (minutter)</label>
            <input
                    type="number"
                    id="time"
                    min="1"
                    placeholder="fx 30"
                    required
            >
        </div>

        <button type="submit" id="submitBtn">
            <span id="btnText">Analysér løb</span>
            <span id="spinner" class="spinner" style="display: none;"> ⏳</span>
        </button>
    </form>

    <!-- Loading -->
    <div class="loading" id="loading">
        <p>🏃 Analyserer dit løb...</p>
    </div>

    <!-- Error Message -->
    <div class="error" id="errorMessage"></div>

    <!-- Analysis Result -->
    <div class="results" id="resultSection">
        <h2>📊 Din Analyse</h2>
        <div class="result-card">
            <h3>Hastighed & Tempo</h3>
            <div id="analysisContent" class="result-content"></div>
        </div>

        <div class="result-card">
            <h3>💡 Træningsforslag</h3>
            <div id="suggestionsContent" class="result-content"></div>
        </div>

        <button class="secondary-btn" onclick="showHistory()">
            Se tidligere løb →
        </button>
    </div>

    <!-- Recent Runs -->
    <div class="results history" id="historySection">
        <div class="history-header">
            <h2>📜 Løbehistorik</h2>
            <button class="icon-btn" id="refreshBtn" title="Opdater">🔄</button>
        </div>

        <div id="recentRuns" class="runs-container">
            <p class="loading-text">Henter løb...</p>
        </div>

        <button class="secondary-btn" onclick="hideHistory()">
            ← Tilbage til analyse
        </button>
    </div>

    <!-- Footer -->
    <footer>
        SportResponse &copy; 2025 | Powered by Groq AI
    </footer>
</div>

<script src="/js/main.js"></script>
</body>
</html>
